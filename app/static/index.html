<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAERII Knowledge Engine</title>
  <meta name="description" content="Raw Material Knowledge Engine for Minor Forest Produce — search, explore, and analyze tribal raw materials." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link rel="stylesheet" href="/static/style.css?v=4.2" />
</head>
<body>

<div class="app-container">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title-row">
        <h1>MAERII</h1>
        <button class="theme-toggle" id="themeToggle" title="Toggle light/dark theme" onclick="toggleTheme()">☀️</button>
      </div>
      <div class="subtitle">Forest Produce Business Guide</div>
    </div>
    <div class="search-container">
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="Search materials..."
        autocomplete="off"
      />
    </div>
    <div class="sidebar-category-pills" id="categoryPills"></div>
    <div class="material-list" id="materialList">
      <!-- Populated by JS -->
    </div>
    <div class="sidebar-footer" id="sidebarFooter">Loading...</div>
  </aside>

  <!-- Main -->
  <main class="main-content" id="mainContent">
    <!-- Empty state (shown initially) -->
    <div class="empty-state" id="emptyState">
      <div class="icon">🌿</div>
      <h2>Select a Material</h2>
      <p>Pick a forest produce from the list to discover what you can make, real market prices, and your earning potential.</p>
    </div>

    <!-- Detail view (hidden initially) -->
    <div class="hidden" id="detailView">
      <!-- Populated by JS -->
    </div>
  </main>

</div>

<script src="/static/app.js?v=4.2"></script>
</body>
</html>
